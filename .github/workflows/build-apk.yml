name: Build offline Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch and bundle upstream offline assets
        run: python3 scripts/prepare_assets.py
      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          python3 - "$APK" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              for p in ['assets/index.html','assets/app.js','assets/models/hand_landmarker.task','assets/wasm/vision_wasm_internal.wasm','assets/wasm/vision_wasm_nosimd_internal.wasm']:
                  assert z.getinfo(p).file_size > 0, p
          PY
          cp "$APK" GrandLuxuryTree-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GrandLuxuryTree-Android
          path: GrandLuxuryTree-Android.apk
          if-no-files-found: error
